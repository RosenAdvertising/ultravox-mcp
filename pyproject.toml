[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ultravox-mcp"
version = "0.1.0"
description = "MCP server for Ultravox voice AI — call management, transcripts, tool configuration"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27.2",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "keyring>=24.3.1",
]

[project.scripts]
ultravox-mcp = "ultravox_mcp.server:main"
ultravox-mcp-setup = "ultravox_mcp.setup.setup:main"
ultravox-mcp-verify = "ultravox_mcp.setup.verify:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ultravox_mcp*"]

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false
