[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultravox-mcp"
version = "0.2.0"
description = "MCP server for Ultravox: calls, transcripts and tools (REST layer only)."
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=2.3,<3",
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.8.5,<1",
]

[project.scripts]
ultravox-mcp = "ultravox_mcp.server:main"
ultravox-mcp-setup = "ultravox_mcp.cli:setup_main"
ultravox-mcp-verify = "ultravox_mcp.cli:verify_main"

[project.urls]
Homepage = "https://github.com/RosenAdvertising/ultravox-mcp"
Repository = "https://github.com/RosenAdvertising/ultravox-mcp"
Issues = "https://github.com/RosenAdvertising/ultravox-mcp/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ultravox_mcp*"]

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "S", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
